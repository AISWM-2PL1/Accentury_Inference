name: Verify release records
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  release-records:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check source and release consistency
        run: python3 tools/verify_release.py
